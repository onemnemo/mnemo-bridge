# Runs the tests on every push and pull request against main, on all three
# platforms the app ships for. Packaging stays in release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The converter itself needs only requests. keyring is for the settings test.
      - name: Install dependencies
        run: pip install -r requirements.txt keyring

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Check for em and en dashes
        run: python tools/check_dashes.py
